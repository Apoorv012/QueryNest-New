name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - run: pip install -r requirements.txt ruff mypy types-psycopg2
      - run: ruff check .
      - run: mypy core/
      - run: pytest
